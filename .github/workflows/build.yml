name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run per ref; a new push supersedes the one still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the release job asks for more.
permissions:
  contents: read

env:
  MAVEN_OPTS: -Xmx1g

jobs:
  # Compile and run the full test suite. RuntimeSmokeIT is skipped here (no
  # -Dbirt.runtime.dir), it gets its own job below.
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The render tests draw with Java2D through the logical SansSerif font,
      # which needs a physical font installed on the runner.
      - name: Install a physical font for Java2D
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      # build.ps1 is Windows-only and just pins the local toolchain; on the
      # runner setup-java has already done that, so call Maven directly.
      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Upload the bundle jars
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/*.jar
          if-no-files-found: error
          retention-days: 30

      # The rendered charts, so a reviewer can eyeball what the suite produced.
      - name: Upload the rendered previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-renders
          path: build/test-output/*.png
          if-no-files-found: warn
          retention-days: 30

  # End-to-end proof against the real BIRT POJO runtime: RuntimeSmokeIT runs the
  # sample report through the distribution's own ReportRunner.
  runtime-smoke:
    name: BIRT runtime smoke test
    runs-on: ubuntu-latest
    needs: build
    env:
      BIRT_RUNTIME_URL: https://download.eclipse.org/birt/updates/release/4.24.0/downloads/birt-runtime-4.24.0-202606100854.zip
    steps:
      - uses: actions/checkout@v4

      # ~100 MB download, so keep it keyed on the exact URL it came from.
      - name: Cache the BIRT runtime distribution
        id: birt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/birt-runtime.zip
          key: birt-runtime-${{ env.BIRT_RUNTIME_URL }}

      - name: Download the BIRT runtime distribution
        if: steps.birt-cache.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/birt-runtime.zip" "$BIRT_RUNTIME_URL"

      # The zip carries ReportEngine/ at its top level; RuntimeSmokeIT expects
      # <birt.runtime.dir>/ReportEngine/lib, so publish whichever level has it.
      - name: Unpack the BIRT runtime distribution
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/birt-runtime"
          rm -rf "$dest"
          unzip -q "$RUNNER_TEMP/birt-runtime.zip" -d "$dest"
          if [ ! -d "$dest/ReportEngine/lib" ]; then
            nested="$(find "$dest" -maxdepth 2 -type d -name ReportEngine -print -quit)"
            if [ -n "$nested" ]; then
              dest="$(dirname "$nested")"
            fi
          fi
          test -d "$dest/ReportEngine/lib" || {
            echo "::error::no ReportEngine/lib under $dest - the distribution layout changed"
            exit 1
          }
          echo "BIRT_RUNTIME_DIR=$dest" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install a physical font for Java2D
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      # `test` (not `verify`) is enough: the IT falls back to build/classes when
      # the jar has not been packaged, and `test` always produces build/classes.
      - name: Run RuntimeSmokeIT
        run: mvn -B -ntp -Dtest=RuntimeSmokeIT -Dbirt.runtime.dir="$BIRT_RUNTIME_DIR" test

  # Only for v* tags: publish the GitHub Release and the GitHub Packages artifact.
  release:
    name: release
    runs-on: ubuntu-latest
    needs: [build, runtime-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      # server-id: github writes the settings.xml server entry that `mvn deploy`
      # authenticates with, from GITHUB_ACTOR / GITHUB_TOKEN.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github

      - name: Check the tag against the pom version
        run: |
          set -euo pipefail
          pom_version="$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pom_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME says version '$tag_version' but pom.xml says '$pom_version' - bump the pom or retag"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches pom version $pom_version"

      - name: Download the bundle jars
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: build

      # Third-party action, and this job holds contents: write / packages: write -
      # so it is pinned to a full commit SHA, not a movable tag. Dependabot bumps it.
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            build/io.github.lextpf.birt.chart.piecewiseconstant_*.jar
          generate_release_notes: true

      - name: Deploy to GitHub Packages
        run: mvn -B -ntp -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
