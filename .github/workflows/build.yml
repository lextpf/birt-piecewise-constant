name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this file on a v* tag, so the jar that ends up on the
  # release page is built from the tagged commit by the same steps that every
  # push to main goes through - not by a second, divergent recipe.
  workflow_call:

# One build per ref; a new push supersedes the one still in flight.
# The group is spelled out instead of ${{ github.workflow }}: inside a called
# workflow that expression resolves to the *caller's* name, so build.yml and
# test.yml would both land in "release-refs/tags/v1.0.0" during a release run
# and cancel-in-progress would have them kill each other.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Read-only. A called workflow can never hold more than the caller job grants,
# so this is a ceiling as well as a default.
permissions:
  contents: read

# Workflow-level env is not propagated from a caller into a called workflow,
# so this has to live here rather than once in release.yml.
env:
  MAVEN_OPTS: -Xmx1g

jobs:
  # Compile and package only. The tests live in test.yml, which runs in
  # parallel with this on every push, PR and release.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Java2D needs a physical font behind the logical SansSerif family.
      # -DskipTests draws nothing today, but the install costs two seconds and
      # keeps this job runnable the moment anything here starts rendering.
      - name: Install a physical font for Java2D
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      # build.ps1 is Windows-only and just pins the local toolchain; on the
      # runner setup-java has already done that, so call Maven directly.
      - name: Package the bundle
        run: mvn -B -ntp -DskipTests clean package

      # Two files: the OSGi bundle and its sources jar (maven-source-plugin
      # binds jar-no-fork to package). upload-artifact roots the zip at the
      # least common ancestor of the matches, so both land at the artifact
      # root and download-artifact restores them straight into build/.
      # This is the only place in the repo that uploads "plugin-jar".
      - name: Upload the bundle jars
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/*.jar
          if-no-files-found: error
          retention-days: 30
